<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found - msitte</title>
    <link href="/style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Google+Sans+Code:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        .errorContainer {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1rem;
        }
        .errorCode {
            font-family: 'Google Sans Code', monospace;
            font-size: 5rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.04em;
            margin: 0;
            line-height: 1;
        }
        .errorTitle {
            font-size: 1.25rem;
            color: rgba(255, 255, 255, 0.6);
            margin: 1rem 0 2rem 0;
            font-weight: 400;
        }
        .errorBtn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #161619;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            padding: 10px 18px;
            color: #ffffff;
            font-size: 0.9rem;
            text-decoration: none;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }
        .errorBtn:hover {
            border-color: rgba(255, 255, 255, 0.25);
            background: #1c1c20;
        }
        .errorBtn .material-symbols-outlined {
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="https://github.com/ucursor/msitte" class="companyLogoLink" title="msitte" aria-label="msitte" target="_blank" rel="noopener noreferrer">
            <img src="/images/m.png" alt="msitte" class="companyLogoImg">
        </a>
        <div class="midNav">
            <a class="navLink" href="/">Home</a>
            <a class="navLink" href="/developers/docs/introduction.html">Docs</a>
            <a class="navLink" href="https://discord.gg/5KctFJj9Qk" target="_blank" rel="noopener noreferrer">Community</a>
            <a class="navLink" href="https://github.com/ucursor/msitte" target="_blank" rel="noopener noreferrer">GitHub</a>
        </div>
    </div>

    <main class="errorContainer">
        <h1 class="errorCode">404</h1>
        <p class="errorTitle">Page not found</p>
        <a href="/" class="errorBtn">
            <span class="material-symbols-outlined">arrow_back</span>
            <span>Back to home</span>
        </a>
    </main>
</body>
</html>
